name: Build custom QGC Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 5.15.2

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [normal]
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout QGroundControl v4.4.0
        run: |
          git clone --branch v4.4.0 --depth 1 --recurse-submodules https://github.com/mavlink/qgroundcontrol.git qgc
          cd qgc
          git submodule update --init --recursive --depth 1

      - name: Apply custom changes
        run: |
          cp patches/apply_custom.py qgc/apply_custom.py
          cd qgc
          python3 apply_custom.py ${{ matrix.variant }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          dir: ${{ runner.temp }}
          modules: qtcharts
          setup-python: true

      - name: Install Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: false

      - name: Install Android API 30
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3"
          # Qt 5.15 picks the newest installed Android platform automatically.
          # Remove newer/ext platforms so androiddeployqt can only select API 30.
          find "$ANDROID_SDK_ROOT/platforms" -mindepth 1 -maxdepth 1 -type d ! -name "android-30" -print -exec rm -rf {} +
          ls -la "$ANDROID_SDK_ROOT/platforms"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build

      - name: Install GStreamer Android
        working-directory: qgc
        run: |
          wget --quiet https://gstreamer.freedesktop.org/data/pkg/android/1.18.6/gstreamer-1.0-android-universal-1.18.6.tar.xz
          mkdir gstreamer-1.0-android-universal-1.18.6
          tar xf gstreamer-1.0-android-universal-1.18.6.tar.xz -C gstreamer-1.0-android-universal-1.18.6

      - name: Build arm64 APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build-${{ matrix.variant }}
          cd build-${{ matrix.variant }}
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export ANDROID_PLATFORM=android-30
          qmake -r ../qgc/qgroundcontrol.pro -spec android-clang CONFIG+=StableBuild CONFIG+=installer ANDROID_ABIS="arm64-v8a" ANDROID_PLATFORM="android-30"
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path("android-QGroundControl-deployment-settings.json")
          data = json.loads(p.read_text())
          def fix(v):
              if isinstance(v, dict):
                  return {k: fix(val) for k, val in v.items()}
              if isinstance(v, list):
                  return [fix(x) for x in v]
              if v == "android-36-ext19":
                  return "android-30"
              return v
          p.write_text(json.dumps(fix(data), indent=2))
          PY
          make -j2
          cp package/QGroundControl64.apk ../QGC_4.4_${{ matrix.variant }}.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGC_4.4_${{ matrix.variant }}
          path: QGC_4.4_${{ matrix.variant }}.apk

      - name: Publish rolling release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view custom-latest >/dev/null 2>&1 || gh release create custom-latest --title "Custom QGC latest" --notes "Automatically built custom QGC 4.4.0 APKs"
          gh release upload custom-latest QGC_4.4_${{ matrix.variant }}.apk --clobber
