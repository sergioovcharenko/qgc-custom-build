name: Build custom QGC Android

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: 5.15.2

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        variant: [normal, active10]
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v4

      - name: Checkout QGroundControl v4.4.0
        run: |
          git clone --branch v4.4.0 --depth 1 --recurse-submodules https://github.com/mavlink/qgroundcontrol.git qgc
          cd qgc
          git submodule update --init --recursive --depth 1

      - name: Apply custom changes
        run: |
          cp patches/apply_custom.py qgc/apply_custom.py
          cd qgc
          python3 apply_custom.py ${{ matrix.variant }}

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{ env.QT_VERSION }}
          host: linux
          target: android
          dir: ${{ runner.temp }}
          modules: qtcharts
          setup-python: true

      - name: Install Android NDK r21e
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r21e
          add-to-path: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 30
        run: |
          yes | sdkmanager "platforms;android-30" "build-tools;30.0.3"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ccache ninja-build

      - name: Install GStreamer Android
        working-directory: qgc
        run: |
          wget --quiet https://gstreamer.freedesktop.org/data/pkg/android/1.18.6/gstreamer-1.0-android-universal-1.18.6.tar.xz
          mkdir gstreamer-1.0-android-universal-1.18.6
          tar xf gstreamer-1.0-android-universal-1.18.6.tar.xz -C gstreamer-1.0-android-universal-1.18.6

      - name: Build arm64 APK
        env:
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_LATEST_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          mkdir -p build-${{ matrix.variant }}
          cd build-${{ matrix.variant }}
          qmake -r ../qgc/qgroundcontrol.pro -spec android-clang CONFIG+=StableBuild CONFIG+=installer ANDROID_ABIS="arm64-v8a" ANDROID_PLATFORM="android-30"
          make -j2
          cp package/QGroundControl64.apk ../QGC_4.4_${{ matrix.variant }}.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: QGC_4.4_${{ matrix.variant }}
          path: QGC_4.4_${{ matrix.variant }}.apk

      - name: Publish rolling release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view custom-latest >/dev/null 2>&1 || gh release create custom-latest --title "Custom QGC latest" --notes "Automatically built custom QGC 4.4.0 APKs"
          gh release upload custom-latest QGC_4.4_${{ matrix.variant }}.apk --clobber
